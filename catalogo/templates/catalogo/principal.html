{% extends 'catalogo/base.html' %}
{% block titulo %}Libros creados{% endblock %}

{% block contenido %}
        <ul>
            {% for libro in libros %}
                <li><a href="{% url 'detalle_libro' pk=libro.pk %}">
                    {{forloop.counter}} - {{libro.titulo}}</a></li>
            {% empty %}
                <li>No tiene libros</li>
            {% endfor %}
        </ul>
{% endblock %}
